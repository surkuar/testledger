name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PRs: a new push cancels the older run on the same branch.
# Pushes to main: one group per commit, so every commit runs to completion.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff format
        run: ruff format --check src tests examples

      - name: ruff check
        run: ruff check src tests examples

      - name: mypy
        run: mypy src

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        run: pytest

      - name: End-to-end demo
        run: |
          python examples/generate_demo.py demo-estate
          cd demo-estate
          testledger analyze --config testledger.yml --reports . --mutation mutation.json --out reports
          testledger memo reports
          test -s reports/memo.md
          test -s reports/memo.html
          test -s reports/ledger.json
          test -s reports/summary.json
