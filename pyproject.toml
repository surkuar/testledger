[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testledger"
version = "0.1.0"
description = "Test Estate Balance Sheet: turn CI results and git history into per-test P&L and executive Quality Investment Memos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suresh Babu", email = "sureshbabu.santhakumar@gmail.com" }]
keywords = ["testing", "quality-engineering", "ci", "flaky-tests", "test-roi", "engineering-leadership"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "requests>=2.31",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "build>=1.2"]
narrative = ["openai>=1.0"]

[project.scripts]
testledger = "testledger.cli:app"

[project.urls]
Homepage = "https://github.com/surkuar/testledger"
Issues = "https://github.com/surkuar/testledger/issues"
Documentation = "https://github.com/surkuar/testledger/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
testledger = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is owned by `ruff format`

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
